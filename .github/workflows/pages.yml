# Publishes public/ as a preview at https://tmpostudio.github.io/SLP/
# The preview copy is marked noindex so it never competes with the real domain in search.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare preview copy
        run: |
          cp -r public _site
          rm -f _site/.htaccess
          find _site -name '*.html' -exec sed -i 's#<meta charset="utf-8">#<meta charset="utf-8">\n<meta name="robots" content="noindex, nofollow">#' {} +
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          # 404.html uses root-relative paths; point them at the /SLP/ project path
          sed -i -E 's#(href|src)="/#\1="/SLP/#g' _site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
